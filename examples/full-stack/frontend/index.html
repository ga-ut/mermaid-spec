<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2efe8">
  <link rel="icon" href="data:,">
  <title>Workboard</title>
  <style>
    :root { color-scheme: light; --paper: #f2efe8; --ink: #16181d; --muted: #6d6b65; --line: #cac6bc; --accent: #3156df; --white: #fffefa; font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: var(--paper); color: var(--ink); }
    button, input { font: inherit; }
    button { cursor: pointer; }
    #app { min-height: 100svh; padding-bottom: 108px; animation: settle 480ms cubic-bezier(.2,.8,.2,1) both; }
    .topbar { height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 clamp(20px, 4vw, 64px); border-bottom: 1px solid var(--line); }
    .brand, .workspace-meta { display: flex; align-items: center; gap: 12px; }
    .brand strong { font-size: 15px; letter-spacing: -.02em; }
    .brand-mark { width: 11px; height: 11px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 12%, transparent); }
    .workspace-meta { color: var(--muted); font-size: 12px; }
    .workspace-meta span + span::before { content: ""; display: inline-block; width: 4px; height: 4px; margin: 0 12px 2px 0; border-radius: 50%; background: #49a46c; }
    .workspace-meta [data-failed="true"] { color: #a63e32; }
    main { padding: 52px clamp(20px, 4vw, 64px) 36px; }
    .workspace-heading { display: flex; align-items: end; justify-content: space-between; gap: 48px; margin-bottom: 44px; }
    .eyebrow { margin: 0 0 10px; color: var(--accent); font-size: 11px; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(38px, 5vw, 72px); line-height: .92; letter-spacing: -.065em; }
    .workspace-heading > p { max-width: 390px; margin: 0; color: var(--muted); font-size: 13px; line-height: 1.55; }
    .board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--ink); }
    .lane { min-width: 0; padding: 0 22px; border-left: 1px solid var(--line); animation: lane-in 520ms cubic-bezier(.2,.8,.2,1) calc(80ms * var(--lane-index)) both; }
    .lane:first-child { padding-left: 0; border-left: 0; }
    .lane:last-child { padding-right: 0; }
    .lane-heading { height: 60px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
    .lane-heading h2 { margin: 0; font-size: 13px; letter-spacing: -.01em; }
    .lane-heading span { min-width: 22px; height: 22px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 99px; color: var(--muted); font-size: 11px; }
    .task { min-height: 154px; display: flex; flex-direction: column; justify-content: space-between; gap: 30px; padding: 22px 0 18px; border-bottom: 1px solid var(--line); transition: transform 180ms ease, border-color 180ms ease; }
    .task:hover { transform: translateY(-2px); border-color: var(--ink); }
    .task h3 { margin: 0 0 9px; font-size: 16px; line-height: 1.25; letter-spacing: -.025em; }
    .task p { display: -webkit-box; overflow: hidden; -webkit-line-clamp: 2; -webkit-box-orient: vertical; margin: 0; color: var(--muted); font-size: 12px; line-height: 1.55; }
    .task footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .task footer span { overflow: hidden; color: var(--muted); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .task button { padding: 6px 0; border: 0; border-bottom: 1px solid currentColor; background: transparent; color: var(--accent); font-size: 11px; font-weight: 700; transition: opacity 150ms ease, transform 150ms ease; }
    .task button:hover { transform: translateX(2px); }
    .task button:disabled { cursor: wait; opacity: .4; }
    .empty { margin: 24px 0; color: var(--muted); font-size: 12px; }
    .composer { position: fixed; z-index: 5; right: 0; bottom: 0; left: 0; min-height: 84px; display: grid; grid-template-columns: minmax(180px, .8fr) minmax(220px, 1.5fr) auto; align-items: end; gap: 24px; padding: 14px clamp(20px, 4vw, 64px) 18px; border-top: 1px solid var(--ink); background: color-mix(in srgb, var(--paper) 94%, transparent); backdrop-filter: blur(16px); }
    .composer label { display: grid; gap: 5px; }
    .composer label span { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .1em; }
    .composer input { width: 100%; padding: 7px 0; border: 0; border-bottom: 1px solid var(--line); outline: 0; background: transparent; color: var(--ink); font-size: 13px; transition: border-color 150ms ease; }
    .composer input:focus { border-color: var(--accent); }
    .composer button { min-height: 42px; padding: 0 20px; border: 0; background: var(--accent); color: white; font-size: 12px; font-weight: 750; transition: transform 150ms ease, background 150ms ease; }
    .composer button:hover { transform: translateY(-2px); background: #2446c7; }
    .fatal { margin: 48px; color: #a63e32; }
    @keyframes settle { from { opacity: 0; transform: translateY(8px); } }
    @keyframes lane-in { from { opacity: 0; transform: translateY(16px); } }
    @media (max-width: 760px) {
      #app { padding-bottom: 180px; }
      .workspace-meta span:first-child, .workspace-heading > p { display: none; }
      main { padding-top: 34px; }
      .workspace-heading { margin-bottom: 30px; }
      .board { grid-template-columns: 1fr; }
      .lane, .lane:first-child, .lane:last-child { padding: 0; border-left: 0; }
      .lane + .lane { margin-top: 28px; border-top: 1px solid var(--ink); }
      .composer { grid-template-columns: 1fr; gap: 8px; padding-top: 10px; }
      .composer button { margin-top: 4px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <script type="module" src="/browser.js"></script>
</body>
</html>
